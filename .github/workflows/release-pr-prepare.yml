name: Release PR Prepare

# Glue that runs ONLY on release-please's own PR branch, never on main. It
# resyncs uv.lock to the versions release-please just bumped and keeps the
# MCP server's client-version floor truthful (fixes #238, and keeps it fixed
# on every future release). Both changes land as commits on the release PR
# branch, so they merge atomically with the version bump in a single commit -
# nothing here ever touches main directly.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: release-pr-prepare-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sync:
    # release-please's manifest-mode branch name for a grouped PR is
    # release-please--branches--<default-branch>; match by prefix so this
    # doesn't silently stop working if the suffix ever changes. Guard against
    # forks since we push a commit back to the PR branch.
    if: |
      startsWith(github.event.pull_request.head.ref, 'release-please--') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Mint GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - name: Checkout release PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Install UV
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.13

      - name: "Sync MCP -> client dependency floor (fixes #238)"
        run: |
          set -euo pipefail
          CLIENT_VERSION=$(python3 -c \
            "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          CURRENT_FLOOR=$(grep -oE 'stocktrim-openapi-client>=[0-9.]+' \
            stocktrim_mcp_server/pyproject.toml | head -n1 | sed 's/.*>=//')
          echo "Client version on this release PR: $CLIENT_VERSION"
          echo "Current MCP -> client floor: $CURRENT_FLOOR"
          if [ "$CURRENT_FLOOR" != "$CLIENT_VERSION" ]; then
            sed -i "s/stocktrim-openapi-client>=[0-9.]\+/stocktrim-openapi-client>=$CLIENT_VERSION/" \
              stocktrim_mcp_server/pyproject.toml
            echo "Updated floor to >=$CLIENT_VERSION"
          else
            echo "Floor already matches; nothing to do"
          fi

      - name: "Sync stocktrim_mcp_server __version__ (belt-and-braces for extra-files)"
        # release-please-config.json's extra-files entry should already keep
        # this in sync; this step exists in case that under-delivers (known
        # release-please-action#879 caveat) so a mismatch never ships.
        run: |
          set -euo pipefail
          MCP_VERSION=$(python3 -c \
            "import tomllib; print(tomllib.load(open('stocktrim_mcp_server/pyproject.toml', 'rb'))['project']['version'])")
          sed -i "s/^__version__ = \".*\"/__version__ = \"${MCP_VERSION}\"/" \
            stocktrim_mcp_server/src/stocktrim_mcp_server/__init__.py

      - name: Resync uv.lock
        run: uv lock

      - name: Commit if changed
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if git diff --quiet -- uv.lock stocktrim_mcp_server/pyproject.toml \
            stocktrim_mcp_server/src/stocktrim_mcp_server/__init__.py; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "dougborg-release-please[bot]"
          git config user.email "309159260+dougborg-release-please[bot]@users.noreply.github.com"
          git add uv.lock stocktrim_mcp_server/pyproject.toml \
            stocktrim_mcp_server/src/stocktrim_mcp_server/__init__.py
          git commit -m "chore(release): sync uv.lock and MCP client pin"
          git push origin "HEAD:$HEAD_REF"
