name: Deploy Documentation

on:
  push:
    branches: [main]
  release:
    types: [published]
  # Pull requests build and check the tracked site but never deploy it.
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "stocktrim_public_api_client/**"
      - ".github/workflows/docs.yml"
      - "overrides/**"
      - "scripts/site_analytics.mjs"
      - "scripts/site-analytics.json"
  workflow_dispatch:

# Least privilege at the workflow level; jobs opt into the scopes they need.
permissions: {}

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install UV
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Prepare visitor analytics
        # Fetches the pinned @dougborg/site-analytics, checks its integrity, and
        # writes the config element and module file; overrides/main.html adds the
        # module tag. See scripts/site_analytics.mjs.
        run: node scripts/site_analytics.mjs prepare

      - name: Build documentation
        run: |
          uv run poe docs-clean
          uv run poe docs-build
        env:
          CI_DOCS_BUILD: "true"

      # TODO: Re-enable after MkDocs migration complete
      # - name: Test documentation
      #   run: uv run poe test-docs
      #   env:
      #     CI_DOCS_BUILD: "true"

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Check every page is tracked and links the privacy page
        run: node scripts/site_analytics.mjs check site

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
