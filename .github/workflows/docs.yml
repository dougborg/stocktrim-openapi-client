name: Deploy Documentation

on:
  push:
    branches: [main]
  release:
    types: [published]
  # Pull requests build and check the tracked site but never deploy it.
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "stocktrim_public_api_client/**"
      - ".github/workflows/docs.yml"
      - "overrides/**"
      - "scripts/site_analytics.mjs"
      - "scripts/site-analytics.json"
  workflow_dispatch:

# Least privilege at the workflow level; jobs opt into the scopes they need.
permissions: {}

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Install UV
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Prepare visitor analytics
        # Fetches the pinned @dougborg/site-analytics, checks its integrity, and
        # writes the config element and module file; overrides/main.html adds the
        # module tag. See scripts/site_analytics.mjs.
        run: node scripts/site_analytics.mjs prepare

      - name: Build documentation
        run: |
          uv run poe docs-clean
          uv run poe docs-build
        env:
          CI_DOCS_BUILD: "true"

      # TODO: Re-enable after MkDocs migration complete
      # - name: Test documentation
      #   run: uv run poe test-docs
      #   env:
      #     CI_DOCS_BUILD: "true"

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Check every page is tracked and links the privacy page
        run: node scripts/site_analytics.mjs check site

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
