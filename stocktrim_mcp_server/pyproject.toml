[project]
name = "stocktrim-mcp-server"
version = "0.17.0"
description = "Model Context Protocol (MCP) server for StockTrim Inventory Management API"
authors = [
    {name = "Doug Borg", email = "dougborg@dougborg.org"},
]
maintainers = [
    {name = "Doug Borg", email = "dougborg@dougborg.org"},
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11,<3.14"
keywords = [
  "stocktrim",
  "mcp",
  "model-context-protocol",
  "api-client",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  # Floor only (see docs/RELEASE.md and issue #238 for the tradeoffs
  # considered). release-pr-prepare.yml rewrites this floor to match the
  # client version on every release PR, so it can go stale by at most one
  # release cycle and can never point at an unpublished version.
  "stocktrim-openapi-client>=0.14.0",
  "fastmcp>=3.0.0,<4.0.0",
  "python-dotenv>=1.0.0",
  "structlog>=24.1.0",
]

[tool.uv.sources]
stocktrim-openapi-client = { workspace = true }

[project.scripts]
stocktrim-mcp-server = "stocktrim_mcp_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stocktrim_mcp_server"]

# Versioning, changelog generation, and tagging are handled by release-please
# (see release-please-config.json and .release-please-manifest.json at the repo
# root) rather than python-semantic-release. See docs/RELEASE.md.
